name: Test and publish GEM Autoworks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests/test_app.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start the app
        env:
          SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
          DATA_DIR: /tmp/gem-ci
          ADMIN_EMAIL: admin@example.test
          ADMIN_PASSWORD: change-me-please-123
          COOKIE_SECURE: 'false'
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Check every page, the booking flow and the admin in Chromium
        run: |
          python tests/visual_smoke.py
          python tests/flow_smoke.py
          python tests/admin_shots.py
      - name: Show the app log
        if: failure()
        run: cat /tmp/app.log
      - name: Save design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gem-responsive-previews
          path: visual-artifacts/
          retention-days: 7

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Calculate lowercase registry path
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up QEMU for Raspberry Pi image
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM64 + AMD64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=GEM Autoworks web app and booking management
