{% extends 'admin/base.html' %}
{% block title %}Sign in{% endblock %}
{% block bare %}
<main class="login-box">
  <img src="/static/img/gem-logo-310.webp" alt="GEM Autoworks" width="180" height="127">
  <h1 class="app-h2" style="text-align:center">Admin sign in</h1>
  {% if error %}<p class="notice notice--bad" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label for="ad-email">Email</label><input id="ad-email" name="email" type="email" autocomplete="username" required autofocus></div>
    <div class="field"><label for="ad-pw">Password</label><input id="ad-pw" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn--primary" type="submit">Sign in</button>
  </form>
</main>
{% endblock %}
