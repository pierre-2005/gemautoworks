<!doctype html>
<html lang="en" data-type="service" data-radius="soft" data-buttons="block" data-motion{% block html_attrs %}{% endblock %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ site.business_name }}: mobile car detailing in {{ site.service_area }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.seo_description }}{% endblock %}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:image" content="/static/img/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/static/img/gem-mark-32.png" type="image/png">
<link rel="apple-touch-icon" href="/static/img/gem-mark-180.png">
<meta name="theme-color" content="#0b0f14">
<meta name="site-kind" content="other">
<meta name="page-type" content="service">
<link rel="preload" href="/static/fonts/red-hat-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/red-hat-text-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/fonts.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/kit/system.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/kit/ui/cards.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/kit/motion/motion.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/kit/layout/layout.css?v={{ asset_v }}">
<style>
:root {
  --p-bg: #eef1f4; --p-surface: #e2e7ec; --p-ink: #0b0f14; --p-muted: #4b5563;
  --p-accent: #0b5cad; --p-accent-ink: #eef1f4; --p-action: #0b5cad; --p-action-ink: #eef1f4;
  --p-inv-bg: #0b0f14; --p-inv-surface: #171b21; --p-inv-ink: #eef1f4; --p-inv-muted: #8e9196;
  --p-inv-accent: #eef1f4; --p-inv-accent-ink: #0b0f14; --p-inv-action: #eef1f4; --p-inv-action-ink: #0b0f14;
  --font-display: "Red Hat Display", system-ui, sans-serif;
  --font-text: "Red Hat Text", system-ui, sans-serif;
  --display-weight: 400;
  --display-tracking: -0.025em;
  --display-tracking-xl: -0.035em;
}
</style>
<link rel="stylesheet" href="/static/css/site.css?v={{ asset_v }}">
{% block head %}{% endblock %}
<script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
</head>
<body class="{% block body_class %}{% endblock %}">
{% include 'partials/nav.html' %}
{% block body %}{% endblock %}
<script type="module" src="/static/kit/system.js?v={{ asset_v }}"></script>
<script type="module" src="/static/kit/motion/motion.js?v={{ asset_v }}"></script>
<script type="module" src="/static/kit/layout/layout.js?v={{ asset_v }}"></script>
<script type="module" src="/static/js/site.js?v={{ asset_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
