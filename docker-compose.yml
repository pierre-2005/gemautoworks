# Portainer Git stack; image built and published by GitHub Actions.
# Set credentials in Portainer Environment variables, never commit a .env file.
services:
  gem-autoworks:
    image: ghcr.io/pierre-2005/gemautoworks:latest
    container_name: gem-autoworks
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?Set_SECRET_KEY_in_Portainer}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/New_York}
      # the public address, used for links in emails (https://your-domain)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set_PUBLIC_BASE_URL_in_Portainer_for_example_https://gemautoworks.com}
      COOKIE_SECURE: "true"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:8092:8000"
    volumes:
      - gem_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  gem_data:
networks:
  default:
    name: gem-autoworks-net
